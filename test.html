<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"></head>
<body style="font-family:sans-serif;padding:20px">
<h2>Test de conexión Firestore</h2>
<div id="result">Probando...</div>
<script>
const API_KEY = "AIzaSyBV5HzqGiYoekZqmT23iwE6zyomBX4CcZ4";
const url = "https://firestore.googleapis.com/v1/projects/topmobility/databases/(default)/documents/abonados?key=" + API_KEY;

document.getElementById('result').innerHTML = "Iniciando fetch a:<br>" + url + "<br><br>";

fetch(url)
  .then(function(r) {
    document.getElementById('result').innerHTML += "Respuesta recibida. Status: " + r.status + "<br>";
    return r.json();
  })
  .then(function(data) {
    document.getElementById('result').innerHTML += "JSON parseado OK<br>Documentos encontrados: " + (data.documents ? data.documents.length : 0) + "<br><pre>" + JSON.stringify(data, null, 2).slice(0, 500) + "</pre>";
  })
  .catch(function(e) {
    document.getElementById('result').innerHTML += "<strong style='color:red'>ERROR: " + e.message + "</strong>";
  });
</script>
</body>
</html>
